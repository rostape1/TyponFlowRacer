<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WIND TREND — RADAR DISPLAY</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  color: #00ff41;
  overflow: hidden;
  user-select: none;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  width: 100%;
  max-width: 1140px;
  padding: 6px 12px;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #00cc33;
  text-shadow: 0 0 6px #00ff4177;
}

.header .title { font-size: 13px; letter-spacing: 3px; font-weight: bold; }

.screen-wrap {
  position: relative;
  border: 1px solid #004400;
  border-radius: 4px;
  box-shadow: 0 0 50px #00ff4122, 0 0 100px #00ff4108, inset 0 0 80px #000a00;
  overflow: hidden;
  flex-shrink: 0;
}

canvas { display: block; }

/* CRT scanlines */
.scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 2px,
    rgba(0,0,0,0.12) 2px,
    rgba(0,0,0,0.12) 3px
  );
  z-index: 2;
}

/* CRT vignette */
.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
  z-index: 3;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 1140px;
  padding: 6px 12px;
  font-size: 10px;
  letter-spacing: 1px;
  color: #006622;
}

.readout {
  font-size: 13px;
  font-weight: bold;
  color: #00cc33;
  text-shadow: 0 0 8px #00ff4199;
  letter-spacing: 2px;
}

.load-btn {
  background: transparent;
  border: 1px solid #004400;
  color: #007a1a;
  font-family: 'Courier New', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 4px 14px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.15s;
}
.load-btn:hover { border-color: #00ff41; color: #00ff41; text-shadow: 0 0 6px #00ff41; }

#fileInput { display: none; }

.drop-hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  letter-spacing: 3px;
  color: #003300;
  pointer-events: none;
  z-index: 1;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div class="header">
  <span class="title">WIND TREND</span>
  <span id="modeLabel">SIMULATION</span>
  <span id="clockLabel">--:--:-- UTC</span>
</div>

<div class="screen-wrap" id="screenWrap">
  <canvas id="c"></canvas>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="drop-hint" id="dropHint">DROP NMEA LOG HERE</div>
</div>

<div class="footer">
  <span class="readout" id="windReadout">TWD: ---°&nbsp;&nbsp;SPD: -- KT</span>
  <span id="dataInfo">DEMO DATA — 120s WINDOW</span>
  <button class="load-btn" onclick="document.getElementById('fileInput').click()">LOAD LOG</button>
</div>

<input type="file" id="fileInput" accept=".txt,.nmea,.log">

<script>
// ── Canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const hint   = document.getElementById('dropHint');

const PAD = 20; // padding from body edges
const W = Math.min(window.innerWidth  - PAD * 2, 1140);
const H = Math.min(window.innerHeight - 110,      620);
canvas.width  = W;
canvas.height = H;
document.getElementById('screenWrap').style.width = W + 'px';

// ── Layout constants ─────────────────────────────────────────────────────────
const ML = 56;  // left margin (degree labels)
const MR = 12;  // right margin
const MT = 18;  // top margin
const MB = 28;  // bottom margin
const PW = W - ML - MR;  // plot width
const PH = H - MT - MB;  // plot height

// ── State ────────────────────────────────────────────────────────────────────
let points      = [];   // { t: ms, deg: 0-360, spd: knots }
let fileMode    = false;
let fileSpanMs  = 0;
let simAngle    = 45;
let simSpd      = 8;
let animId      = null;
const SIM_WINDOW_MS = 120_000;  // 120 seconds rolling window in sim mode

// ── Coordinate helpers ────────────────────────────────────────────────────────
// Map wind direction (0-360) → display angle (-180..+180), 0° = N = center
function toDisplay(deg) {
  const d = ((deg % 360) + 360) % 360;
  return d > 180 ? d - 360 : d;
}

// Display angle → y pixel
function degToY(displayDeg) {
  return MT + PH / 2 - (displayDeg / 180) * (PH / 2);
}

// ── Y-axis tick config ───────────────────────────────────────────────────────
const TICKS = [
  { deg:  180, label: '180° S', dim: true  },
  { deg:  135, label: '135°',   dim: true  },
  { deg:   90, label: ' 90° E', dim: true  },
  { deg:   45, label: ' 45°',   dim: true  },
  { deg:    0, label: '  0° N', dim: false },
  { deg:  -45, label: '-45°',   dim: true  },
  { deg:  -90, label: '-90° W', dim: true  },
  { deg: -135, label: '-135°',  dim: true  },
  { deg: -180, label: '-180°',  dim: true  },
];

// ── Drawing ──────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background gradient
  const bg = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.65);
  bg.addColorStop(0, '#001400');
  bg.addColorStop(1, '#000600');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // ── Grid lines ──
  TICKS.forEach(({ deg, dim }) => {
    const y     = degToY(deg);
    const isZ   = deg === 0;
    const color = isZ ? '#005500' : '#001e00';

    ctx.beginPath();
    ctx.moveTo(ML, y);
    ctx.lineTo(W - MR, y);
    ctx.strokeStyle = color;
    ctx.lineWidth   = isZ ? 1.5 : 0.75;
    ctx.setLineDash(isZ ? [] : [4, 10]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Vertical time grid
  const vtickSpacing = 100; // px
  ctx.setLineDash([2, 8]);
  ctx.strokeStyle = '#001800';
  ctx.lineWidth = 0.75;
  for (let x = ML; x <= W - MR; x += vtickSpacing) {
    ctx.beginPath();
    ctx.moveTo(x, MT);
    ctx.lineTo(x, H - MB);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Plot border
  ctx.strokeStyle = '#003300';
  ctx.lineWidth = 1;
  ctx.strokeRect(ML, MT, PW, PH);

  // ── Y-axis labels ──
  ctx.textAlign = 'right';
  TICKS.forEach(({ deg, label, dim }) => {
    const y    = degToY(deg);
    const isZ  = deg === 0;
    ctx.fillStyle = isZ ? '#00aa22' : '#003300';
    ctx.font      = isZ ? 'bold 10px Courier New' : '9px Courier New';
    ctx.fillText(label, ML - 5, y + 3.5);
  });

  // ── Time labels (bottom) ──
  if (points.length > 1) {
    const windowMs = fileMode ? fileSpanMs : SIM_WINDOW_MS;
    const now      = fileMode ? points[points.length - 1].t : Date.now();
    const tStart   = now - windowMs;

    ctx.fillStyle = '#003000';
    ctx.font      = '9px Courier New';
    ctx.textAlign = 'center';

    for (let x = ML; x < W - MR; x += vtickSpacing) {
      const ageSec = Math.round(((W - MR - x) / PW) * windowMs / 1000);
      const label  = ageSec >= 60
        ? `-${Math.round(ageSec / 60)}m`
        : `-${ageSec}s`;
      ctx.fillText(label, x, H - MB + 15);
    }
    ctx.fillStyle = '#00aa22';
    ctx.font      = 'bold 9px Courier New';
    ctx.fillText('NOW', W - MR, H - MB + 15);
  }

  // ── Wind line ──
  if (points.length > 1) {
    const windowMs = fileMode ? fileSpanMs : SIM_WINDOW_MS;
    const now      = fileMode ? points[points.length - 1].t : Date.now();
    const tStart   = now - windowMs;

    // Build screen coords, break line on 180° wrap artifacts
    const segments = [[]];
    let prevDisplay = null;

    for (const p of points) {
      const x = ML + ((p.t - tStart) / windowMs) * PW;
      if (x < ML - 2) continue;

      const displayDeg = toDisplay(p.deg);
      const y = degToY(displayDeg);

      // Detect 180° wrap (e.g. 179° → -179°) — lift pen
      if (prevDisplay !== null && Math.abs(displayDeg - prevDisplay) > 150) {
        segments.push([]);
      }
      segments[segments.length - 1].push({ x, y });
      prevDisplay = displayDeg;
    }

    // Draw each segment twice: glow pass then sharp pass
    for (let pass = 0; pass < 2; pass++) {
      ctx.save();
      if (pass === 0) {
        ctx.shadowColor = '#00ff41';
        ctx.shadowBlur  = 10;
        ctx.strokeStyle = 'rgba(0,255,65,0.2)';
        ctx.lineWidth   = 5;
      } else {
        ctx.shadowColor = '#00ff41';
        ctx.shadowBlur  = 5;
        ctx.strokeStyle = '#00ff41';
        ctx.lineWidth   = 1.5;
      }
      ctx.lineJoin = 'round';
      ctx.lineCap  = 'round';

      for (const seg of segments) {
        if (seg.length < 2) continue;
        ctx.beginPath();
        ctx.moveTo(seg[0].x, seg[0].y);
        for (let i = 1; i < seg.length; i++) ctx.lineTo(seg[i].x, seg[i].y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Current-value dot (right edge)
    const lastDisplay = toDisplay(points[points.length - 1].deg);
    const dotY = degToY(lastDisplay);
    ctx.save();
    ctx.shadowColor = '#00ff41';
    ctx.shadowBlur  = 20;
    ctx.fillStyle   = '#00ff41';
    ctx.beginPath();
    ctx.arc(W - MR - 1, dotY, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Current reading overlay (top-right of plot)
    const last = points[points.length - 1];
    const trueDir = Math.round(((last.deg % 360) + 360) % 360);
    ctx.save();
    ctx.shadowColor = '#00ff41';
    ctx.shadowBlur  = 12;
    ctx.fillStyle   = '#00ff41';
    ctx.font        = 'bold 28px Courier New';
    ctx.textAlign   = 'right';
    ctx.fillText(trueDir.toString().padStart(3, '0') + '°', W - MR - 10, MT + 34);
    ctx.font      = '11px Courier New';
    ctx.fillStyle = '#006622';
    ctx.fillText(last.spd.toFixed(1) + ' KT', W - MR - 10, MT + 50);
    ctx.restore();
  }
}

// ── Simulation ────────────────────────────────────────────────────────────────
let simInterval = null;
let drawInterval = null;

function startSim() {
  stopSim();
  hint.style.display = 'none';
  simInterval = setInterval(() => {
    simAngle += (Math.random() - 0.48) * 5;  // slight rightward drift
    simAngle  = ((simAngle % 360) + 360) % 360;
    simSpd    = Math.max(0.5, Math.min(35, simSpd + (Math.random() - 0.5) * 1.2));
    points.push({ t: Date.now(), deg: simAngle, spd: simSpd });
    if (points.length > 5000) points.shift();
  }, 250);

  drawInterval = setInterval(() => { draw(); updateUI(); }, 50);
}

function stopSim() {
  clearInterval(simInterval);
  clearInterval(drawInterval);
  simInterval = drawInterval = null;
}

function updateUI() {
  const now = new Date();
  document.getElementById('clockLabel').textContent =
    now.toUTCString().slice(17, 25) + ' UTC';

  if (points.length === 0) return;
  const last = points[points.length - 1];
  const dir  = Math.round(((last.deg % 360) + 360) % 360);
  document.getElementById('windReadout').textContent =
    `TWD: ${dir.toString().padStart(3, '0')}°  SPD: ${last.spd.toFixed(1)} KT`;
}

// ── NMEA file loading ─────────────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadNMEA(ev.target.result, file.name);
  reader.readAsText(file);
});

// Drag and drop
const wrap = document.getElementById('screenWrap');
document.addEventListener('dragover', e => { e.preventDefault(); hint.style.display = 'flex'; });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) hint.style.display = 'none'; });
document.addEventListener('drop', e => {
  e.preventDefault();
  hint.style.display = 'none';
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadNMEA(ev.target.result, file.name);
  reader.readAsText(file);
});

function loadNMEA(text, filename) {
  const parsed = [];
  let sourceLabel = '';

  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;

    // Timestamp can be at start: "2026-04-16 04:45:21.469  [tag]  $SENTENCE"
    // or just: "2026-04-16 04:45:21.469  $SENTENCE"
    const m = line.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}[.,]\d+)\s+(?:\[.*?\]\s+)?(.+)$/);
    const sentence = m ? m[2].trim() : line;
    const ts       = m ? new Date(m[1].replace(',', '.') + 'Z').getTime() : null;

    let dir = null, spd = null;

    if (/^\$[A-Z]{2}MWD,/.test(sentence)) {
      // $xxMWD,<dir_T>,T,<dir_M>,M,<spd_N>,N,<spd_M>,M
      const f = sentence.split(',');
      if (f[1] && f[1].trim() !== '') {
        dir = parseFloat(f[1]);
        spd = f[5] ? parseFloat(f[5]) : 0;
        if (!sourceLabel) sourceLabel = 'TRUE WIND (MWD)';
      }
    } else if (/^\$[A-Z]{2}MWV,/.test(sentence)) {
      // $xxMWV,<angle>,<R|T>,<spd>,N,A
      const f = sentence.split(',');
      // Prefer T (true), accept R (relative) as fallback
      if (f[1] && f[2]) {
        dir = parseFloat(f[1]);
        spd = f[3] ? parseFloat(f[3]) : 0;
        if (!sourceLabel) sourceLabel = f[2].trim() === 'T' ? 'TRUE WIND (MWV-T)' : 'APP WIND (MWV-R)';
      }
    }

    if (dir !== null && !isNaN(dir)) {
      parsed.push({ ts: ts || Date.now(), dir, spd: spd || 0 });
    }
  }

  if (parsed.length === 0) {
    alert('No wind direction data found.\nNeeds $IIMWD, $WIMWD, $IIMWV, or $WIMWV sentences.');
    return;
  }

  stopSim();
  fileMode   = true;
  fileSpanMs = Math.max(parsed[parsed.length - 1].ts - parsed[0].ts, 5000);

  // Offset timestamps so the last point lands at "now"
  const offset = Date.now() - parsed[parsed.length - 1].ts;
  points = parsed.map(p => ({ t: p.ts + offset, deg: p.dir, spd: p.spd }));

  const last    = parsed[parsed.length - 1];
  const lastDir = Math.round(((last.dir % 360) + 360) % 360);
  const spanMin = Math.round(fileSpanMs / 60000);

  document.getElementById('modeLabel').textContent  = 'FILE MODE';
  document.getElementById('dataInfo').textContent   = `${parsed.length} PTS  ${spanMin}m SPAN  ${sourceLabel}`;
  document.getElementById('windReadout').textContent =
    `TWD: ${lastDir.toString().padStart(3, '0')}°  SPD: ${last.spd.toFixed(1)} KT`;

  const now = new Date();
  document.getElementById('clockLabel').textContent = now.toUTCString().slice(17, 25) + ' UTC';

  draw();
}

// ── Boot ─────────────────────────────────────────────────────────────────────
startSim();
</script>
</body>
</html>
