<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typon — calibration session</title>
<style>
body { margin: 0; background: #0a1628; color: #c8d6e5; font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid rgba(100, 150, 200, 0.25); }
header a { color: #5dade2; text-decoration: none; font-size: 14px; }
main { max-width: 900px; margin: 0 auto; padding: 4px 16px 32px; }
h1 { font-size: 20px; color: #f5f6fa; margin: 0; }
h2 { font-size: 18px; color: #f5f6fa; margin: 16px 0 8px; }
h3 { font-size: 16px; color: #f5f6fa; margin: 20px 0 6px; }
p { margin: 8px 0; }
ul, ol { margin: 6px 0 6px 20px; padding: 0; }
li { margin: 5px 0; }
strong { color: #f5f6fa; }
.review-table { overflow-x: auto; margin: 10px 0; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; font-size: 13px; }
th, td { border: 1px solid rgba(100, 150, 200, 0.25); padding: 6px 8px; text-align: left; vertical-align: top; }
th { color: #f5f6fa; background: rgba(255, 255, 255, 0.05); }
td:empty { min-width: 60px; }
#err { color: #e74c3c; }
</style>
</head>
<body>
<header><a href="hub.html">← Hub</a><h1>Calibration session</h1></header>
<main id="doc"><p>Loading…</p></main>
<script src="js/review-text.js"></script>
<script>
// The plan is static/calibration-plan.md, rendered with the race reviews' renderer (textContent only, P19).
fetch('calibration-plan.md', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(md => { const el = document.getElementById('doc'); el.textContent = ''; el.appendChild(ReviewText.render(md)); })
    .catch(e => {
        const el = document.getElementById('doc');
        el.textContent = '';
        const p = document.createElement('p');
        p.id = 'err';
        p.textContent = 'Could not load the calibration plan (' + e.message + ').';
        el.appendChild(p);
    });
</script>
</body>
</html>
