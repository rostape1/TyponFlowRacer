name: Deploy to GitHub Pages

on:
  repository_dispatch:
    types: [data-updated]
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'tests/**'
      - 'pi/**'
      - 'download_offline.py'
      - 'nmea_*.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run physics tests
        run: node tests/test_physics.mjs

      - name: Run staleness gate tests
        run: node tests/test_staleness.mjs

      - name: Run cross-file invariant tests
        run: node tests/test_invariants.mjs

      - name: Run replay/scrub tests
        run: node tests/test_replay.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pi server deps
        run: pip install -r pi/requirements.txt

      - name: Run boat server tests
        run: python3 tests/test_boat_server.py

      - name: Run log clock tests
        run: python3 tests/test_log_clock.py

      - name: Byte-compile the Pi server and root scripts
        run: python3 -m py_compile pi/boat_server.py nmea_capture.py nmea_ws_proxy.py download_offline.py tools/fix_log_times.py

      - name: Syntax-check the boat shell scripts
        run: bash -n start_boat.sh play_logs.sh pi/startup.sh pi/test_boat_server.sh pi/ais-set-clock.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Restore data cache
        uses: actions/cache/restore@v5
        with:
          path: static/data
          key: env-data
          restore-keys: |
            env-data-

      - name: Restore land_mask.json from git
        run: git checkout HEAD -- static/data/land_mask.json

      - name: List data files
        run: |
          echo "=== Data directory ==="
          find static/data -type f -name "*.json" | head -50 || echo "No data files yet"
          echo "=== Total size ==="
          du -sh static/data 2>/dev/null || echo "No data dir"

      - name: Inject build hash
        run: |
          HASH=$(git rev-parse --short=12 HEAD)
          for f in static/js/app.js static/sw.js; do
            sed -i "s/const APP_BUILD = '[^']*'/const APP_BUILD = '$HASH'/" "$f"
            grep -q "const APP_BUILD = '$HASH'" "$f" || { echo "::error::cache-bust injection failed in $f"; exit 1; }
          done

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
