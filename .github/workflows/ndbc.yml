name: Fetch NDBC Buoy Observations

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 min, matching buoy update frequency
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore data cache
        uses: actions/cache/restore@v5
        with:
          path: static/data
          key: env-data
          restore-keys: |
            env-data-

      - name: Fetch NDBC stations
        run: python .github/scripts/fetch_ndbc.py

      - name: Save data cache
        uses: actions/cache/save@v5
        with:
          path: static/data
          key: env-data-${{ github.run_id }}-ndbc

      - name: Trigger deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: data-updated
          client-payload: '{"source": "ndbc"}'

      - name: Weekly keepalive commit
        # GitHub auto-disables scheduled workflows after 60 days with no
        # repo pushes — cron runs and cache writes don't count. A real
        # commit resets that clock so the data pipeline doesn't silently
        # go stale (see 2026-08 SFBOFS outage).
        # Note: extension-less filename on purpose — .gitignore has *.txt.
        run: |
          LAST=$(git log -1 --format=%ct -- .github/data-heartbeat 2>/dev/null || echo 0)
          NOW=$(date +%s)
          if [ $((NOW - ${LAST:-0})) -gt 604800 ]; then
            date -u > .github/data-heartbeat
            git config user.email "actions@github.com"
            git config user.name "github-actions"
            git add .github/data-heartbeat
            git commit -m "chore: keepalive heartbeat [skip ci]"
            git push
          fi
