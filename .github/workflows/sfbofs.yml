name: Fetch SFBOFS Current Field

on:
  schedule:
    # NOAA posts all 49 files ~1h23m after each cycle (03/09/15/21z -> 04:23, 10:23, 16:23, 22:23
    # UTC, measured on S3 Oct 2026). Two tries just after that; GitHub delays or drops many
    # scheduled runs, so the hourly :20 check stays as the safety net (and is the third try).
    - cron: '31,47 4,10,16,22 * * *'
    - cron: '20 * * * *'  # Every hour at :20 — fetches up to 49 hours (0-48) incrementally
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Restore data cache
        uses: actions/cache/restore@v5
        with:
          path: static/data
          key: env-data
          restore-keys: |
            env-data-

      - name: Fetch SFBOFS data
        run: python .github/scripts/fetch_sfbofs.py

      - name: Save data cache
        uses: actions/cache/save@v5
        with:
          path: static/data
          key: env-data-${{ github.run_id }}-sfbofs

      - name: Trigger deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: data-updated
          client-payload: '{"source": "sfbofs"}'
